<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="./assets/css/theme.css" />
    <link rel="stylesheet" href="./assets/css/header.css" />
    <link rel="stylesheet" href="./assets/css/job-application.css" />

    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: {
              anton: ["Anton", "Impact", "sans-serif"],
              jakarta: ["Plus Jakarta Sans", "Arial", "sans-serif"],
            },
          },
        },
      };
    </script>

    <title>Job Application</title>
  </head>

  <body
    class="event-background-page min-h-screen overflow-x-hidden bg-[#000929] text-white"
  >
    <div class="event-background-shell">
      <!-- Navbar -->
      <header
        class="site-header absolute top-0 left-0 w-full z-50 bg-transparent"
      >
        <nav class="header-inner">
          <a href="/" class="header-logo" aria-label="Piramida homepage">
            <img src="./assets/images/logo piramida.svg" alt="Piramida logo" />
          </a>

          <button
            id="openMenu"
            class="menu-open-button"
            type="button"
            aria-label="Open menu"
            aria-expanded="false"
            aria-controls="mobileMenu"
          >
            <img
              src="./assets/images/menu icon.svg"
              alt=""
              class="h-8 w-8 object-contain"
            />
          </button>
        </nav>
      </header>

      <!-- Fullscreen menu -->
      <div id="mobileMenu" aria-hidden="true">
        <!-- Close button -->
        <button
          id="closeMenu"
          class="menu-close-button"
          type="button"
          aria-label="Close menu"
        >
          <img
            src="./assets/images/Cross.svg"
            alt=""
            class="h-8 w-8 object-contain"
          />
        </button>

        <div class="menu-layout">
          <!-- Left side -->
          <section class="menu-left">
            <img
              src="./assets/images/logo piramida.svg"
              alt="Piramida logo"
              class="menu-logo"
            />

            <nav class="menu-main-navigation" aria-label="Main navigation">
              <ul>
                <li>
                  <a href="#" class="mobile-main-link">Education</a>
                </li>

                <li>
                  <a href="#" class="mobile-main-link">Innovation</a>
                </li>

                <li>
                  <a href="#" class="mobile-main-link">Business</a>
                </li>

                <li>
                  <a href="#" class="mobile-main-link">Art &amp; Culture</a>
                </li>

                <li>
                  <a href="#" class="mobile-main-link">Events</a>
                </li>

                <li>
                  <a href="#" class="mobile-main-link">Attractions</a>
                </li>

                <li>
                  <a href="#" class="mobile-main-link"> Museum </a>
                </li>

                <li>
                  <a href="#" class="mobile-main-link">Rent a Space</a>
                </li>
              </ul>
            </nav>
          </section>

          <!-- Right side -->
          <section class="menu-right">
            <div class="menu-right-content">
              <nav
                class="menu-secondary-links"
                aria-label="Secondary navigation"
              >
                <a href="#" class="mobile-small-link">About us</a>
                <a href="#" class="mobile-small-link">News</a>
                <a href="#" class="mobile-small-link">Careers</a>
                <a href="#" class="mobile-small-link">Contact</a>
              </nav>

              <div class="menu-bottom-content">
                <div class="menu-policy-links">
                  <a href="#" class="mobile-footer-link">
                    Terms &amp; Conditions
                  </a>

                  <a href="#" class="mobile-footer-link">Privacy Policy</a>
                </div>

                <div class="menu-social-links">
                  <a href="#" aria-label="Facebook">
                    <svg
                      viewBox="0 0 24 24"
                      fill="none"
                      xmlns="http://www.w3.org/2000/svg"
                    >
                      <path
                        d="M14 8H17V4H14C10.7 4 9 6 9 9V11H6V15H9V22H13V15H16L17 11H13V9C13 8.3 13.3 8 14 8Z"
                        stroke="currentColor"
                        stroke-width="1.7"
                        stroke-linejoin="round"
                      />
                    </svg>
                  </a>

                  <a href="#" aria-label="Instagram">
                    <svg
                      viewBox="0 0 24 24"
                      fill="none"
                      xmlns="http://www.w3.org/2000/svg"
                    >
                      <rect
                        x="3"
                        y="3"
                        width="18"
                        height="18"
                        rx="5"
                        stroke="currentColor"
                        stroke-width="1.7"
                      />

                      <circle
                        cx="12"
                        cy="12"
                        r="4"
                        stroke="currentColor"
                        stroke-width="1.7"
                      />

                      <circle cx="17.5" cy="6.5" r="1" fill="currentColor" />
                    </svg>
                  </a>
                </div>
              </div>
            </div>
          </section>
        </div>
      </div>

      <main id="main-content">
        <section class="job-application-section">
          <div class="job-application-shape" aria-hidden="true"></div>

          <button
            class="job-application-close"
            type="button"
            aria-label="Close job application form"
          >
            <img
              src="./assets/images/Cross.svg"
              alt=""
              class="h-7 w-7 object-contain"
            />
          </button>

          <div class="job-application-card">
            <button
              class="job-application-close-mobile"
              type="button"
              aria-label="Close job application form"
            >
              <span aria-hidden="true"></span>
            </button>

            <h1 class="job-application-title">Job Application</h1>
            <p class="job-application-subtitle">
              Please fill out the form to submit job application
            </p>

            <form class="job-application-form" action="#" method="post">
              <div class="job-application-row">
                <div class="job-application-field">
                  <label class="sr-only" for="firstName">First Name</label>
                  <input
                    id="firstName"
                    name="firstName"
                    type="text"
                    autocomplete="given-name"
                    placeholder="First Name*"
                    required
                  />
                </div>

                <div class="job-application-field">
                  <label class="sr-only" for="lastName">Last Name</label>
                  <input
                    id="lastName"
                    name="lastName"
                    type="text"
                    autocomplete="family-name"
                    placeholder="Last Name*"
                    required
                  />
                </div>
              </div>

              <div class="job-application-field">
                <label class="sr-only" for="email">Email Address</label>
                <input
                  id="email"
                  name="email"
                  type="email"
                  autocomplete="email"
                  placeholder="Email Address*"
                  required
                />
              </div>

              <div class="job-application-field">
                <label class="sr-only" for="phone">Phone Number</label>
                <input
                  id="phone"
                  name="phone"
                  type="tel"
                  autocomplete="tel"
                  inputmode="tel"
                  placeholder="Phone Number*"
                  required
                />
              </div>

              <label class="job-application-upload" for="resume">
                <span>Upload your resume</span>
                <svg
                  class="job-application-upload-icon"
                  viewBox="0 0 24 24"
                  aria-hidden="true"
                >
                  <path
                    d="M8.5 17.5H7.75a4.25 4.25 0 0 1-.8-8.42 5.5 5.5 0 0 1 10.55 1.7 3.5 3.5 0 0 1-.5 6.97h-.5"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="1.7"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                  />
                  <path
                    d="M12 20v-7M9.25 15.75 12 13l2.75 2.75"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="1.7"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                  />
                </svg>
                <input
                  id="resume"
                  name="resume"
                  type="file"
                  accept=".pdf,.doc,.docx"
                />
              </label>

              <div class="job-application-field">
                <label class="sr-only" for="message">Message</label>
                <textarea
                  id="message"
                  name="message"
                  placeholder="Message"
                  rows="2"
                ></textarea>
              </div>

              <button class="job-application-submit" type="submit">
                <span>Submit</span>
                <svg
                  class="job-application-submit-arrow"
                  viewBox="0 0 24 24"
                  aria-hidden="true"
                >
                  <path
                    d="M5 12h14M13 6l6 6-6 6"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="1.8"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                  />
                </svg>
              </button>
            </form>
          </div>
        </section>
      </main>
    </div>

    <script src="./assets/js/menu.js" defer></script>
    <script src="./assets/js/education-carousel.js" defer></script>
  </body>
</html>
