<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Rent a Space</title>

    <script src="https://cdn.tailwindcss.com"></script>

    <link rel="stylesheet" href="./assets/css/theme.css" />
    <link rel="stylesheet" href="./assets/css/header.css" />
    <link rel="stylesheet" href="./assets/css/footer.css" />
    <link rel="stylesheet" href="./assets/css/rent-space.css" />
  </head>

  <body class="min-h-screen overflow-x-hidden text-white">
    <div class="desktop-page-background">
      <!-- =========================================
           HEADER
      ========================================== -->

      <header
        class="site-header absolute left-0 top-0 z-50 w-full bg-transparent"
      >
        <nav class="header-inner">
          <a href="/" class="header-logo" aria-label="Piramida homepage">
            <img src="./assets/images/logo piramida.svg" alt="Piramida logo" />
          </a>

          <button
            id="openMenu"
            class="menu-open-button"
            type="button"
            aria-label="Open menu"
            aria-expanded="false"
            aria-controls="mobileMenu"
          >
            <img
              src="./assets/images/menu icon.svg"
              alt=""
              class="h-8 w-8 object-contain"
              aria-hidden="true"
            />
          </button>
        </nav>
      </header>

      <!-- =========================================
           FULLSCREEN MENU
      ========================================== -->

      <div id="mobileMenu" aria-hidden="true">
        <button
          id="closeMenu"
          class="menu-close-button"
          type="button"
          aria-label="Close menu"
        >
          <img
            src="./assets/images/Cross.svg"
            alt=""
            class="h-8 w-8 object-contain"
            aria-hidden="true"
          />
        </button>

        <div class="menu-layout">
          <!-- Menu left side -->

          <section class="menu-left">
            <img
              src="./assets/images/logo piramida.svg"
              alt="Piramida logo"
              class="menu-logo"
            />

            <nav class="menu-main-navigation" aria-label="Main navigation">
              <ul>
                <li>
                  <a href="#" class="mobile-main-link"> Education </a>
                </li>

                <li>
                  <a href="#" class="mobile-main-link"> Innovation </a>
                </li>

                <li>
                  <a href="#" class="mobile-main-link"> Business </a>
                </li>

                <li>
                  <a href="#" class="mobile-main-link"> Art &amp; Culture </a>
                </li>

                <li>
                  <a href="#" class="mobile-main-link"> Events </a>
                </li>

                <li>
                  <a href="#" class="mobile-main-link"> Attractions </a>
                </li>

                <li>
                  <a href="#" class="mobile-main-link"> Museum </a>
                </li>

                <li>
                  <a
                    href="./rent-space.html"
                    class="mobile-main-link"
                    aria-current="page"
                  >
                    Rent a Space
                  </a>
                </li>
              </ul>
            </nav>
          </section>

          <!-- Menu right side -->

          <section class="menu-right">
            <div class="menu-right-content">
              <nav
                class="menu-secondary-links"
                aria-label="Secondary navigation"
              >
                <a href="#" class="mobile-small-link"> About us </a>

                <a href="#" class="mobile-small-link"> News </a>

                <a href="#" class="mobile-small-link"> Careers </a>

                <a href="#" class="mobile-small-link"> Contact </a>
              </nav>

              <div class="menu-bottom-content">
                <div class="menu-policy-links">
                  <a href="#" class="mobile-footer-link">
                    Terms &amp; Conditions
                  </a>

                  <a href="#" class="mobile-footer-link"> Privacy Policy </a>
                </div>

                <div class="menu-social-links">
                  <a href="#" aria-label="Facebook">
                    <svg
                      viewBox="0 0 24 24"
                      fill="none"
                      xmlns="http://www.w3.org/2000/svg"
                      aria-hidden="true"
                    >
                      <path
                        d="M14 8H17V4H14C10.7 4 9 6 9 9V11H6V15H9V22H13V15H16L17 11H13V9C13 8.3 13.3 8 14 8Z"
                        stroke="currentColor"
                        stroke-width="1.7"
                        stroke-linejoin="round"
                      />
                    </svg>
                  </a>

                  <a href="#" aria-label="Instagram">
                    <svg
                      viewBox="0 0 24 24"
                      fill="none"
                      xmlns="http://www.w3.org/2000/svg"
                      aria-hidden="true"
                    >
                      <rect
                        x="3"
                        y="3"
                        width="18"
                        height="18"
                        rx="5"
                        stroke="currentColor"
                        stroke-width="1.7"
                      />

                      <circle
                        cx="12"
                        cy="12"
                        r="4"
                        stroke="currentColor"
                        stroke-width="1.7"
                      />

                      <circle cx="17.5" cy="6.5" r="1" fill="currentColor" />
                    </svg>
                  </a>
                </div>
              </div>
            </div>
          </section>
        </div>
      </div>

      <!-- =========================================
           MAIN CONTENT
      ========================================== -->
      <main id="main-content" class="rent-space-main">
        <h1 class="rent-space-title">Rent a Space</h1>

        <section class="rent-space-card-list" aria-label="Rentable spaces">
          <a class="rent-space-card" href="./event-spaces.html">
            <img
              class="rent-space-card-image rent-space-card-image-event"
              src="./assets/images/rent-event-spaces.jpg"
              alt=""
            />

            <span class="rent-space-card-shade" aria-hidden="true"></span>

            <span class="rent-space-card-title">
              Event<br />
              Spaces
            </span>
          </a>

          <a class="rent-space-card" href="./leasing.html">
            <img
              class="rent-space-card-image rent-space-card-image-leasing"
              src="./assets/images/rent-leasing.jpg"
              alt=""
            />

            <span class="rent-space-card-shade" aria-hidden="true"></span>

            <span class="rent-space-card-title">Leasing</span>
          </a>
        </section>
      </main>
    </div>

    <script src="./assets/js/menu.js" defer></script>
  </body>
</html>
