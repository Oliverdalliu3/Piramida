<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="./assets/css/theme.css" />
    <link rel="stylesheet" href="./assets/css/header.css" />
    <link rel="stylesheet" href="./assets/css/event-spaces.css" />

    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: {
              anton: ["Anton", "Impact", "sans-serif"],
              jakarta: ["Plus Jakarta Sans", "Arial", "sans-serif"],
            },
          },
        },
      };
    </script>

    <title>Book an Event Space</title>
  </head>

  <body
    class="event-background-page min-h-screen overflow-x-hidden bg-[#000929] text-white"
  >
    <div class="event-background-shell">
      <!-- Navbar -->
      <header
        class="site-header absolute top-0 left-0 w-full z-50 bg-transparent"
      >
        <nav class="header-inner">
          <a href="/" class="header-logo" aria-label="Piramida homepage">
            <img src="./assets/images/logo piramida.svg" alt="Piramida logo" />
          </a>

          <button
            id="openMenu"
            class="menu-open-button"
            type="button"
            aria-label="Open menu"
            aria-expanded="false"
            aria-controls="mobileMenu"
          >
            <img
              src="./assets/images/menu icon.svg"
              alt=""
              class="h-8 w-8 object-contain"
            />
          </button>
        </nav>
      </header>

      <!-- Fullscreen menu -->
      <div id="mobileMenu" aria-hidden="true">
        <!-- Close button -->
        <button
          id="closeMenu"
          class="menu-close-button"
          type="button"
          aria-label="Close menu"
        >
          <img
            src="./assets/images/Cross.svg"
            alt=""
            class="h-8 w-8 object-contain"
          />
        </button>

        <div class="menu-layout">
          <!-- Left side -->
          <section class="menu-left">
            <img
              src="./assets/images/logo piramida.svg"
              alt="Piramida logo"
              class="menu-logo"
            />

            <nav class="menu-main-navigation" aria-label="Main navigation">
              <ul>
                <li>
                  <a href="#" class="mobile-main-link">Education</a>
                </li>

                <li>
                  <a href="#" class="mobile-main-link">Innovation</a>
                </li>

                <li>
                  <a href="#" class="mobile-main-link">Business</a>
                </li>

                <li>
                  <a href="#" class="mobile-main-link">Art &amp; Culture</a>
                </li>

                <li>
                  <a href="#" class="mobile-main-link">Events</a>
                </li>

                <li>
                  <a href="#" class="mobile-main-link">Attractions</a>
                </li>

                <li>
                  <a href="#" class="mobile-main-link"> Museum </a>
                </li>

                <li>
                  <a href="#" class="mobile-main-link">Rent a Space</a>
                </li>
              </ul>
            </nav>
          </section>

          <!-- Right side -->
          <section class="menu-right">
            <div class="menu-right-content">
              <nav
                class="menu-secondary-links"
                aria-label="Secondary navigation"
              >
                <a href="#" class="mobile-small-link">About us</a>
                <a href="#" class="mobile-small-link">News</a>
                <a href="#" class="mobile-small-link">Careers</a>
                <a href="#" class="mobile-small-link">Contact</a>
              </nav>

              <div class="menu-bottom-content">
                <div class="menu-policy-links">
                  <a href="#" class="mobile-footer-link">
                    Terms &amp; Conditions
                  </a>

                  <a href="#" class="mobile-footer-link">Privacy Policy</a>
                </div>

                <div class="menu-social-links">
                  <a href="#" aria-label="Facebook">
                    <svg
                      viewBox="0 0 24 24"
                      fill="none"
                      xmlns="http://www.w3.org/2000/svg"
                    >
                      <path
                        d="M14 8H17V4H14C10.7 4 9 6 9 9V11H6V15H9V22H13V15H16L17 11H13V9C13 8.3 13.3 8 14 8Z"
                        stroke="currentColor"
                        stroke-width="1.7"
                        stroke-linejoin="round"
                      />
                    </svg>
                  </a>

                  <a href="#" aria-label="Instagram">
                    <svg
                      viewBox="0 0 24 24"
                      fill="none"
                      xmlns="http://www.w3.org/2000/svg"
                    >
                      <rect
                        x="3"
                        y="3"
                        width="18"
                        height="18"
                        rx="5"
                        stroke="currentColor"
                        stroke-width="1.7"
                      />

                      <circle
                        cx="12"
                        cy="12"
                        r="4"
                        stroke="currentColor"
                        stroke-width="1.7"
                      />

                      <circle cx="17.5" cy="6.5" r="1" fill="currentColor" />
                    </svg>
                  </a>
                </div>
              </div>
            </div>
          </section>
        </div>
      </div>

      <main id="main-content">
        <section class="event-space-section">
          <!-- Decorative green background -->
          <div class="event-space-shape" aria-hidden="true"></div>

          <!-- Close button -->
          <button
            class="event-space-close"
            type="button"
            aria-label="Close booking form"
          >
            <img
              src="./assets/images/Cross.svg"
              alt=""
              class="h-7 w-7 object-contain"
            />
          </button>

          <!-- White form card -->
          <div class="event-space-card">
            <button
              class="event-space-close event-space-close-mobile"
              type="button"
              aria-label="Close booking form"
            >
              <span aria-hidden="true"></span>
            </button>

            <h1 class="event-space-title">Book an Event Space</h1>
            <p class="event-space-subtitle hidden md:block">
              Provide your event details and we will confirm availability
            </p>

            <form class="event-space-form" action="#" method="post">
              <!-- Row 1: Full Name & Email -->
              <div class="event-space-row">
                <div class="event-space-field">
                  <label class="sr-only" for="fullName">Full name</label>
                  <input
                    id="fullName"
                    name="fullName"
                    type="text"
                    autocomplete="name"
                    placeholder="Full Name*"
                    required
                  />
                </div>

                <div class="event-space-field">
                  <label class="sr-only" for="email">Email Address</label>
                  <input
                    id="email"
                    name="email"
                    type="email"
                    autocomplete="email"
                    placeholder="Email Address*"
                    required
                  />
                </div>
              </div>

              <!-- Row 2: Number of Guests & Phone -->
              <div class="event-space-row">
                <div class="event-space-field">
                  <label class="sr-only" for="guests">Number of Guests</label>
                  <input
                    id="guests"
                    name="guests"
                    type="number"
                    min="1"
                    inputmode="numeric"
                    placeholder="Number of Guests*"
                    required
                  />
                </div>

                <div class="event-space-field">
                  <label class="sr-only" for="phone">Phone Number</label>
                  <input
                    id="phone"
                    name="phone"
                    type="tel"
                    autocomplete="tel"
                    inputmode="tel"
                    placeholder="Phone Number*"
                    required
                  />
                </div>
              </div>

              <!-- Row 3: Event Type -->
              <div class="event-space-field">
                <label class="sr-only" for="eventType">Event type</label>
                <div class="event-space-select-wrapper">
                  <select id="eventType" name="eventType" required>
                    <option value="">Event type*</option>
                    <option value="conference">Conference</option>
                    <option value="wedding">Wedding</option>
                    <option value="corporate">Corporate Event</option>
                    <option value="private">Private Event</option>
                    <option value="other">Other</option>
                  </select>
                  <span
                    class="event-space-select-arrow"
                    aria-hidden="true"
                  ></span>
                </div>
              </div>

              <!-- Row 4: Preferred Date & Time -->
              <div class="event-space-row">
                <div class="event-space-field">
                  <label class="sr-only" for="date">Preferred Date</label>
                  <input
                    id="date"
                    name="date"
                    type="date"
                    placeholder="Preferred Date"
                    required
                  />
                </div>

                <div class="event-space-field">
                  <label class="sr-only" for="time">Preferred Time</label>
                  <input
                    id="time"
                    name="time"
                    type="time"
                    placeholder="Preferred Time"
                    required
                  />
                </div>
              </div>

              <!-- Row 5: Description -->
              <div class="event-space-field">
                <label class="sr-only" for="description">Description</label>
                <textarea
                  id="description"
                  name="description"
                  placeholder="Description"
                  rows="3"
                ></textarea>
              </div>

              <!-- Submit Button -->
              <button class="event-space-submit" type="submit">
                <span>Submit Request</span>
                <svg
                  class="event-space-submit-arrow"
                  viewBox="0 0 24 24"
                  aria-hidden="true"
                >
                  <path
                    d="M5 12h14M13 6l6 6-6 6"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="1.8"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                  />
                </svg>
              </button>
            </form>
          </div>
        </section>
      </main>
    </div>

    <script src="./assets/js/menu.js" defer></script>
    <script src="./assets/js/education-carousel.js" defer></script>
  </body>
</html>
